# Temporary: asks the teacher's Stress Lab script which book recordings it can
# see, to match them with their activities. Prints names and sizes only.
name: Diagnose book audio
on: push
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the script
        run: |
          URL='https://script.google.com/macros/s/AKfycbzcG7NcKxMGTD_C0T1zOaT-gpzzh-6scqPz8oj4-zN3ArYR4-zsVHf-z2iCINpXo7RXVw/exec'
          echo '== doGet'; curl -sSL "$URL" | head -c 400; echo
          curl -sSL -H 'Content-Type: text/plain;charset=utf-8' --data '{"type":"book-list"}' "$URL" > list.json
          python3 - <<'PY'
          import json
          raw = open('list.json').read()
          try:
              d = json.loads(raw)
          except Exception:
              print('NOT JSON:', raw[:600]); raise SystemExit
          print('== book-list ok:', d.get('ok'), 'error:', d.get('error'), 'files:', len(d.get('files') or []))
          for f in d.get('files') or []:
              print(f"{f.get('folder')} | {f.get('name')} | {f.get('mime')} | {round((f.get('size') or 0)/1024)} KB")
          files = d.get('files') or []
          if files:
              open('first.txt', 'w').write(json.dumps({'type': 'book-audio', 'id': files[0]['id']}))
          PY
          if [ -f first.txt ]; then
            curl -sSL -H 'Content-Type: text/plain;charset=utf-8' --data @first.txt "$URL" > audio.json
            python3 -c "import json;d=json.load(open('audio.json'));print('== book-audio ok:',d.get('ok'),'error:',d.get('error'),'mime:',d.get('mime'),'base64 length:',len(d.get('audio') or ''))" || head -c 400 audio.json
          fi
