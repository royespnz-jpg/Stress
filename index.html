<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stress Lab</title>
    <meta
      name="description"
      content="Word stress practice: every activity of Accurate English Ch. 6–7 and English Pronunciation in Use Units 22 and 28–31, with the book recordings, ElevenLabs voices and a recorder."
    />
    <meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f12" media="(prefers-color-scheme: dark)" />
    <meta name="view-transition" content="same-origin" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317161b'/%3E%3Ccircle cx='8' cy='19' r='3' fill='%23f3eee4'/%3E%3Ccircle cx='17.5' cy='16' r='6' fill='%233a5bff'/%3E%3Ccircle cx='26' cy='19' r='3' fill='%23f3eee4'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint.
      try {
        const t = localStorage.getItem('st.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Onest:wght@400;500;600;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="grain" aria-hidden="true"></div>
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h10" /></svg>
      </button>
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><circle class="bm-s" cx="6.5" cy="19" r="3.2" /><circle class="bm-b" cx="16" cy="16" r="6.6" /><circle class="bm-s" cx="25.5" cy="19" r="3.2" /></svg>
        </span>
        <span class="brand-name">Stress <em>Lab</em></span>
      </a>
      <div class="topbar-right">
        <div class="engine-wrap">
          <button class="engine" id="engine" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="engine-panel">
            <span class="engine-dot" aria-hidden="true"></span>
            <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="engine-label" id="engine-label">Voice engine</span>
            <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
          </button>
          <div class="engine-panel" id="engine-panel" role="dialog" aria-label="Voice engine" hidden></div>
        </div>
        <button class="icon-btn stop-btn" id="stop-btn" aria-label="Stop audio" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" /></svg>
        </button>
        <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-label="Change theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
        </button>
      </div>
      <div class="scroll-progress" aria-hidden="true"></div>
    </header>
    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
      <div class="scrim" id="scrim" hidden></div>
      <main id="main" tabindex="-1"></main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
